# ------------------------------------------------------------------------------------ #
# Description:
#  GitHub Actions pipeline to provision AWS Infra resources for isafety using Terraform
#  Supports branching strategy: feature > release/* > main
# ------------------------------------------------------------------------------------ #

---
name: Deploy cloud watch alert

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::681623867646:role/GitHubActionsDeployerRole
          aws-region: us-east-1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Fmt
        run: terraform fmt -recursive

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: startsWith(github.ref_name, 'releases/')
    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"



